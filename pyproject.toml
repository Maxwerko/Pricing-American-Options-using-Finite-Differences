[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "american-option-fd-solver"
version = "0.1.0"
description = "Finite difference solvers for American options (PSOR, operator splitting)."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "tqdm",
]
